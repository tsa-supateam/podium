[project]
name = "podium-engine"
version = "0.1.0"
description = "Podium offline speech analysis engine (real-time + deep analysis)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.11",
  "websockets>=12",
  "msgpack>=1.0",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "onnxruntime>=1.17",
  "vosk==0.3.44 ; sys_platform == 'darwin'", "vosk>=0.3.45 ; sys_platform != 'darwin'",
  "faster-whisper>=1.0",
  "librosa>=0.10",
  "praat-parselmouth>=0.4.3",
  "ruptures>=1.1.9",
  "scikit-learn>=1.4",
  "nltk>=3.8",
  "yake>=0.4.8",
  "piper-tts>=1.2",
  "pydantic>=2.6",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "pytest-socket>=0.7", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podium_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost"

[tool.ruff]
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402", "B905", "E501"]  # scripts set env vars before importing; zip() strictness not needed
